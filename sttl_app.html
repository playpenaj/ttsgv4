<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singapore Table Tennis League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%93%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* Singapore theme, dark blue: navy header/accents, gold star highlight */
  --navy:#0A2A5E; --navy2:#06183A; --accent:#0A2A5E; --accent2:#123B82;
  --ball:#FFD700;
  --bg:#f5f7fa; --card:#ffffff; --text:#16233a; --muted:#5c6b83; --line:#e3e8f0;
  --ok:#1e8e5a; --warn:#b8860b;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;overflow-x:hidden;width:100%;}
body{background:var(--bg) radial-gradient(circle at 20% 0%,#ffffff 0,transparent 60%);color:var(--text);-webkit-tap-highlight-color:transparent;}
header{background:
    linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.35) 49.6%,rgba(255,255,255,.35) 50.4%,transparent 50.4%),
    linear-gradient(120deg,var(--navy),var(--navy2));
  color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  border-bottom:4px solid #fff;box-shadow:0 2px 0 var(--ball)}
header .brand b .ball{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
header .brand{display:flex;flex-direction:column;min-width:0}
header .brand b{font-size:19px}
header .brand small{color:#cfe0f5;opacity:.85;font-size:12px}
header .sponsor{font-size:12px;color:#cfe0f5}
header .sponsor a{color:#ffd9c4}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;width:100%}
nav button{background:none;border:none;padding:11px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;border-radius:6px;min-height:44px;transition:background .15s,color .15s}
nav button.active{color:var(--navy);border-bottom-color:var(--accent);font-weight:600}
nav button:hover:not(:disabled){background:#f1f5fb;color:var(--navy)}
nav button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:900px;margin:0 auto;padding:16px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ball);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,50,.05);max-width:100%}
h2{margin-top:0;color:var(--navy);font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:6px;font-size:16px;background:#fff}
button.btn{background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;min-height:44px;transition:background .15s,transform .05s;}
button.btn:hover{background:var(--accent2)}
button.btn:active{transform:scale(.98)}
button.btn.secondary{background:var(--navy)}
button.btn.secondary:hover{background:var(--navy2)}
button.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.btn.ghost:hover{background:var(--navy);color:#fff}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn:disabled:hover{background:var(--accent)}
a.btn{display:inline-block;background:#25D366;color:#fff;border:none;padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;min-height:44px;line-height:20px;transition:background .15s}
a.btn:hover{background:#1ebe5a}
.help-fab{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;font-size:18px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:background .15s,transform .1s}
.help-fab:hover{background:#1ebe5a;transform:scale(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.ok{background:#e3f6ec;color:var(--ok)}
.badge.warn{background:#fdecec;color:var(--warn)}
.badge.muted{background:#eef1f5;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.player-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.player-item-head{margin-bottom:4px;font-size:14px}
.player-item-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-top:3px}
.player-item .row{gap:6px;margin-top:6px}
.player-item .row>*{flex:0 0 auto;min-width:0}
.collapsible-header{cursor:pointer;user-select:none;margin-bottom:0}
.collapsible-header:hover{color:var(--accent2)}
.collapsible-body{margin-top:12px}
.admin-card{padding:12px 14px}
.admin-card button.btn{padding:6px 12px;min-height:34px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:hover td{background:#f7f9fc}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:#fff;border-radius:10px;padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto}
.error{color:var(--warn);font-size:13px;margin-top:6px}
.tag{display:inline-block;background:#eef2f8;color:var(--navy);padding:3px 8px;border-radius:6px;font-size:12px;margin-right:4px}
.tag a{cursor:pointer}
.tag a:hover{color:var(--warn)}
.hidden{display:none !important}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;opacity:.9}
.spinner.big{width:28px;height:28px;border-width:3px;border-color:var(--ball);border-top-color:var(--navy);margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{display:flex;align-items:center;justify-content:center;gap:12px;padding:34px;color:var(--muted)}
.paddle-loader{font-size:28px;display:inline-block;animation:swing .8s ease-in-out infinite;transform-origin:70% 90%}
@keyframes swing{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
a.link{color:var(--navy);cursor:pointer;text-decoration:underline;font-size:13px}
a.link:hover{color:var(--accent)}
@media (max-width:600px){
  header{padding:10px 12px}
  main{padding:10px}
  .card{padding:14px}
  nav button{padding:10px 12px;font-size:13px}
  .row>*{min-width:100%}
}
</style>
</head>
<body>

<header>
  <div class="brand"><b>🇸🇬 <span class="ball">🏓</span> Singapore Table Tennis League</b><small>Play. Challenge. Climb the ranks.</small></div>
  <div id="headerSponsor" class="sponsor">Sponsored by <a href="https://www.sintensports.com.sg/" target="_blank">Sin Ten Sports Trading</a></div>
  <div id="whoBar" class="sponsor" style="text-align:right"></div>
  <a class="help-fab" href="https://wa.me/qr/NW3OPXQ4I5JYB1" target="_blank" rel="noopener" title="Questions? Chat with technical support on WhatsApp" aria-label="Technical support on WhatsApp">💬</a>
</header>

<nav id="nav" class="hidden">
  <button data-tab="dashboard" class="navbtn">Dashboard</button>
  <button data-tab="play" class="navbtn">Play</button>
  <button data-tab="info" class="navbtn">Info</button>
  <button data-tab="admin" id="adminNavBtn" class="navbtn hidden">Admin</button>
  <button id="logoutBtn" class="navbtn" style="margin-left:auto">Logout</button>
</nav>

<main id="app"></main>
<div id="modalRoot"></div>
<footer>STTL Platform<span id="footerSponsor"> · Sponsored by Sin Ten Sports Trading</span></footer>

<script>
const SUPABASE_URL = "https://gdvbplbqehrtrgiwwcja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkdmJwbGJxZWhydHJnaXd3Y2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzExOTEsImV4cCI6MjEwNTgwNzE5MX0.w61-EWRvERE2QzXTKMifXp63Pqq5BFgMDKx99k3LPkY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// A second client for admin actions that call auth.signUp() for OTHER
// people (so it never logs the admin out). Created lazily, only the moment
// it's actually needed, so a normal player never has two GoTrue clients
// alive at once — that was causing "Multiple GoTrueClient instances"
// warnings and could contend for the same browser auth lock during login/
// registration.
let _sbAdmin=null;
function getSbAdmin(){
  if(!_sbAdmin){
    _sbAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth:{persistSession:false, autoRefreshToken:false, storageKey:'sb-admin-ephemeral-auth'}
    });
  }
  return _sbAdmin;
}
const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1/admin-actions`;
async function callFn(payload, needsAuth){
  try{
    const headers = {'Content-Type':'application/json'};
    if(needsAuth){
      const {data:{session:s}} = await sb.auth.getSession();
      if(!s){ return {error:'You are not logged in.'}; }
      headers['Authorization'] = 'Bearer '+s.access_token;
    }
    const res = await fetch(FUNCTIONS_URL, {method:'POST', headers, body:JSON.stringify(payload)});
    let json=null;
    try{ json = await res.json(); }catch(e){ /* fall through, handled below */ }
    if(!json){ return {error:`admin-actions function returned an unexpected response (HTTP ${res.status}). Is it deployed?`}; }
    if(!res.ok && !json.error){ return {error:`admin-actions function error (HTTP ${res.status}).`}; }
    return json;
  }catch(e){
    return {error:'Could not reach the admin-actions function: '+(e && e.message ? e.message : e)};
  }
}

const WHATSAPP_URL = 'https://wa.me/qr/NW3OPXQ4I5JYB1';
let session=null, me=null, activeTab='play', players=[], communities=[], sponsorVisible=true, dashboardShowAll=false, mostPlayedView='this';
function applySponsorVisibility(){
  const h=document.getElementById('headerSponsor'), f=document.getElementById('footerSponsor');
  if(h) h.style.display = sponsorVisible ? '' : 'none';
  if(f) f.style.display = sponsorVisible ? '' : 'none';
}

const app=document.getElementById('app');
const modalRoot=document.getElementById('modalRoot');
const nav=document.getElementById('nav');

function setLoading(btn,on,label){
  if(!btn) return;
  if(on){
    if(btn.dataset.orig===undefined) btn.dataset.orig=btn.innerHTML;
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>'+(label||'Processing...');
  }else{
    btn.disabled=false;
    if(btn.dataset.orig!==undefined){ btn.innerHTML=btn.dataset.orig; delete btn.dataset.orig; }
  }
}
function showLoading(msg){
  app.innerHTML='<div class="card"><div class="loading-box"><span class="paddle-loader">🏓</span><span>'+(msg||'Loading…')+'</span></div></div>';
}
function pwOk(p){return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p);}
async function validateName(name, email, excludeId){
  const n=(name||'').trim(), e=(email||'').trim().toLowerCase();
  if(!n) return 'Please enter a name.';
  if(n.toLowerCase()===e) return 'Name cannot be the same as the email address — players only see the name, so it needs to be a real display name.';
  const {data} = await sb.from('sttl_players').select('id').ilike('name', n);
  const clash = (data||[]).find(r=>r.id!==excludeId);
  if(clash) return 'That name is already taken by another player — please choose a different display name.';
  return null;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysSince(d){ if(!d) return 9999; return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function fmtDate(d){return d? new Date(d).toLocaleDateString():'-';}
function fmtDateTime(d){return d? new Date(d).toLocaleString():'Never';}
// Match dates: always the date/time the match was PLAYED. Admin-only
// screens may additionally show the created time.
function fmtPlayed(d){return d? new Date(d).toLocaleString():'—';}
function localInputValue(dt){
  const x=new Date(dt.getTime()-dt.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,16);
}
// Dates default to now and can be changed to an earlier time, never a future one.
// Date/time boxes: default to the current time, can be moved earlier, never later than now.
function initNowInputs(ids){
  ids.forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const refresh=()=>{ el.max=localInputValue(new Date()); };
    refresh(); el.value=localInputValue(new Date());
    el.addEventListener('focus',refresh); el.addEventListener('click',refresh);
  });
}
function validatePlayWhenVenue(whenVal, venue, mode){
  if(!whenVal) return mode==='played' ? 'Please enter the date and time the match was played.' : 'Please enter the date and time of the match.';
  const t=new Date(whenVal).getTime();
  if(isNaN(t)) return 'That date and time is not valid.';
  if(!venue) return 'Please choose the venue (or type it in if it is not listed).';
  if(t > Date.now()+2*60*1000) return 'The date and time cannot be in the future — use now or an earlier time.';
  return '';
}
function isTrialActive(p){return new Date(p.trial_ends_on) >= new Date(new Date().toDateString());}
function canPlay(p){return p.is_approved && (isTrialActive(p) || p.is_subscribed);}

function modal(html){ modalRoot.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; }
function closeModal(){ modalRoot.innerHTML=''; }

// ---------- AUTH VIEWS ----------
function renderLogin(){
  nav.classList.add('hidden');
  app.innerHTML = `
  <div class="card" style="max-width:420px;margin:30px auto">
    <h2>Login</h2>
    <label>Email</label><input id="li_email" type="email">
    <label>Password</label><input id="li_pw" type="password">
    <div class="error" id="li_err"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="li_go">Login</button>
      <button class="btn ghost" id="li_signup">Create account</button>
    </div>
    <p><a class="link" id="li_forgot">Forgot password?</a></p>
    <button class="btn ghost" id="li_guest" style="width:100%;margin-top:10px">View Dashboard as Guest</button>
  </div>`;
  document.getElementById('li_go').onclick = async (e)=>{
    const btn=e.currentTarget;
    const email=document.getElementById('li_email').value.trim();
    const password=document.getElementById('li_pw').value;
    setLoading(btn,true,'Logging in...');
    const {data,error} = await sb.auth.signInWithPassword({email,password});
    if(error){ setLoading(btn,false); document.getElementById('li_err').textContent = error.message; return; }
    session = data.session; await loadMeAndBoot();
  };
  document.getElementById('li_signup').onclick = renderSignup;
  document.getElementById('li_forgot').onclick = renderForgot;
  document.getElementById('li_guest').onclick = renderGuestDashboard;
}

async function renderGuestDashboard(){
  nav.classList.add('hidden');
  showLoading('Loading dashboard…');
  const all = await computeLeagueStats();
  const byRating = [...all].sort((a,b)=>b.rating-a.rating);
  const champion = byRating[0];
  const mostPlayed = rankMostPlayed(all)[0];
  const singlesBoard = [...all].sort((a,b)=>b.singlesWins-a.singlesWins || (b.singlesWins-b.singlesLosses)-(a.singlesWins-a.singlesLosses));
  const doublesBoard = [...all].sort((a,b)=>b.doublesWins-a.doublesWins || (b.doublesWins-b.doublesLosses)-(a.doublesWins-a.doublesLosses));
  const limitFor = (list) => dashboardShowAll ? list.length : 15;
  const guestBoardRows = (list, wKey, lKey) => list.slice(0,limitFor(list)).map((p,i)=>`
    <tr><td>${i+1}</td><td>${esc(p.name)}</td><td><b>${p.rating}</b></td><td>${p[wKey]+p[lKey]}</td><td>${p[wKey]}</td><td>${p[lKey]}</td><td>${winPct(p[wKey],p[lKey])}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No players yet.</td></tr>';

  app.innerHTML = `
  <div class="card"><button class="btn ghost" id="guest_back">← Back to Login</button></div>
  <div class="card"><h2>League highlights</h2>
    <p>🏆 <b>Overall Champion (points):</b> ${champion? `${champion.name} — ${champion.rating} pts`:'-'}</p>
    <p>🎯 <b>Most Played Player:</b> ${mostPlayed && mostPlayed.played>0 ? `${esc(mostPlayed.name)} — ${mostPlayed.played} matches`:'-'}</p>
  </div>
  <div class="card">
    <p class="muted" style="margin:0 0 8px">Showing ${dashboardShowAll? 'all '+all.length : 'top 15 of '+all.length} registered players.</p>
    <div class="row">
      <button class="btn ${dashboardShowAll?'ghost':''}" id="dash_top15">Top 15</button>
      <button class="btn ${dashboardShowAll?'':'ghost'}" id="dash_showall">Show all (${all.length})</button>
    </div>
  </div>
  <div class="card"><h2>Overall leaderboard (by points)</h2>
    <div class="table-scroll"><table><tr><th>#</th><th>Player</th><th>Points</th><th>Played</th><th>W–L</th><th>Win %</th></tr>
    ${byRating.slice(0,limitFor(byRating)).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.rating}</td><td>${p.played}</td><td>${p.wins}–${p.losses}</td><td>${winPct(p.wins,p.losses)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No players yet.</td></tr>'}
    </table></div>
  </div>
  <div class="card"><h2>Singles leaderboard</h2>
    <div class="table-scroll"><table><tr><th>#</th><th>Player</th><th>Points</th><th>Played</th><th>Wins</th><th>Losses</th><th>Win %</th></tr>${guestBoardRows(singlesBoard,'singlesWins','singlesLosses')}</table></div>
  </div>
  <div class="card"><h2>Doubles leaderboard</h2>
    <div class="table-scroll"><table><tr><th>#</th><th>Player</th><th>Points</th><th>Played</th><th>Wins</th><th>Losses</th><th>Win %</th></tr>${guestBoardRows(doublesBoard,'doublesWins','doublesLosses')}</table></div>
  </div>`;
  document.getElementById('guest_back').onclick = renderLogin;
  document.getElementById('dash_top15').onclick = ()=>{ dashboardShowAll=false; renderGuestDashboard(); };
  document.getElementById('dash_showall').onclick = ()=>{ dashboardShowAll=true; renderGuestDashboard(); };
}

async function renderSignup(){
  if(communities.length===0){
    const {data} = await sb.from('sttl_communities').select('name').order('name');
    communities = data || [];
  }
  app.innerHTML = `
  <div class="card" style="max-width:460px;margin:30px auto">
    <h2>Create account</h2>
    <label>Full name</label><input id="su_name">
    <label>Email</label><input id="su_email" type="email">
    <label>Password</label><input id="su_pw" type="password">
    <div class="muted">Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special character.</div>
    <label>Age</label><input id="su_age" type="number" min="10" max="100">
    <label>Community Center</label>
    <select id="su_cc">${communities.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select>
    <div class="error" id="su_err"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="su_go">Register</button>
      <button class="btn ghost" id="su_back">Back to login</button>
    </div>
  </div>`;
  document.getElementById('su_back').onclick = renderLogin;
  document.getElementById('su_go').onclick = async (e)=>{
    const btn=e.currentTarget;
    const name=document.getElementById('su_name').value.trim();
    const email=document.getElementById('su_email').value.trim();
    const pw=document.getElementById('su_pw').value;
    const age=parseInt(document.getElementById('su_age').value,10);
    const cc=document.getElementById('su_cc').value;
    const err=document.getElementById('su_err');
    if(!name||!email||!age||!cc){ err.textContent='Please fill all fields.'; return; }
    if(!pwOk(pw)){ err.textContent='Password does not meet the requirements.'; return; }
    const nameErr = await validateName(name, email);
    if(nameErr){ err.textContent = nameErr; return; }
    setLoading(btn,true,'Registering...');
    const {data,error} = await sb.auth.signUp({email,password:pw});

    // Supabase signals "this email is taken" two different ways depending on
    // the project's "Confirm email" setting: either a direct error whose
    // message contains "already registered", or (when confirmation is on) a
    // successful-looking response with an empty identities array. Catch both.
    const alreadyExists = (error && /already registered|already exists/i.test(error.message))
      || !!(data && data.user && data.user.identities && data.user.identities.length===0);

    if(alreadyExists){
      // Don't just block here — it might be genuinely their own account (or
      // an orphaned login from an earlier attempt). Try signing in with the
      // password they just typed: if that's really them, this recovers the
      // account with no admin step needed at all.
      const {data:signInData, error:signInErr} = await sb.auth.signInWithPassword({email,password:pw});
      if(signInErr){
        setLoading(btn,false);
        err.textContent = 'An account with this email already exists. Please log in with your existing password, or use Forgot password.';
        return;
      }
      session = signInData.session;
      const uid = signInData.user.id;
      const {data:existingProfile} = await sb.from('sttl_players').select('id').eq('id',uid).maybeSingle();
      if(!existingProfile){
        const {error:insErr} = await sb.from('sttl_players').insert({id:uid,name,email,age,community_center:cc});
        if(insErr){ setLoading(btn,false); err.textContent = insErr.message; return; }
      }
      await loadMeAndBoot();
      return;
    }

    if(error){ setLoading(btn,false); err.textContent=error.message; return; }
    const uid = data.user?.id;
    if(!uid){ setLoading(btn,false); err.textContent='Could not create your account. Please try again.'; return; }
    if(data.session){
      // We already have an active session (the normal case once "Confirm

    // have no auth.uid() to satisfy the insert policy. Try the optional
    // admin-actions function as a bridge (it force-confirms + inserts using
    // the service role). If that isn't deployed either, say so plainly.

// Pages through a query so lists longer than the server's 1000-row cap
// still load completely.
async function fetchAllRows(build){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await build(from,from+size-1);
    if(error||!data) break;
    out.push(...data);
    if(data.length<size) break;
  }
  return out;
}
let leagueCache = null; // {players, results} from the latest computeLeagueStats()
async function computeLeagueStats(){
  const {data:allPlayers} = await sb.from('sttl_players').select('id,name,rating,is_approved,photo_url');
  const results = await fetchAllRows((a,b)=>sb.from('sttl_match_results').select('*, sttl_challenges(*)').eq('acknowledged',true).order('id').range(a,b));
  leagueCache = {players:allPlayers||[], results:results||[]};
  const stat = {}; // id -> {wins,losses,played,singlesWins,singlesLosses,doublesWins,doublesLosses}
  const ensure = id => stat[id] || (stat[id] = {wins:0,losses:0,played:0,singlesWins:0,singlesLosses:0,doublesWins:0,doublesLosses:0});
  (results||[]).forEach(r=>{
    const c = r.sttl_challenges; if(!c) return;
    const isDoubles = c.match_type==='doubles';
    const winners = c.challenger_id ? [c.challenger_id] : [];
    const losers = c.opponent_id ? [c.opponent_id] : [];
    let sideAWins = r.winner_side==='challenger';
    let teamA = [c.challenger_id, c.challenger_partner_id].filter(Boolean);
    let teamB = [c.opponent_id, c.opponent_partner_id].filter(Boolean);
    let winTeam = sideAWins ? teamA : teamB;
    let loseTeam = sideAWins ? teamB : teamA;
    winTeam.forEach(id=>{ const s=ensure(id); s.wins++; s.played++; if(isDoubles) s.doublesWins++; else s.singlesWins++; });
    loseTeam.forEach(id=>{ const s=ensure(id); s.losses++; s.played++; if(isDoubles) s.doublesLosses++; else s.singlesLosses++; });
  });
  const merged = (allPlayers||[]).filter(p=>p.is_approved).map(p=>({
    id:p.id, name:p.name, rating:p.rating, photo_url:p.photo_url,
    ...{wins:0,losses:0,played:0,singlesWins:0,singlesLosses:0,doublesWins:0,doublesLosses:0},
    ...(stat[p.id]||{})
  }));
  return merged;
}

// ---- Most-played boards -------------------------------------------------
function monthKeyOf(d){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); }
function monthKeyOffset(off){ const x=new Date(); x.setDate(1); x.setMonth(x.getMonth()+off); return monthKeyOf(x); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
// The date a result belongs to is the date the match was PLAYED.
function resultPlayedAt(r){ return r.sttl_challenges?.scheduled_at || r.recorded_at || r.created_at; }
// period: 'overall' or a month key like '2026-10'
function mostPlayedRows(period){
  if(!leagueCache) return [];
  const stat={};
  leagueCache.results.forEach(r=>{
    const c=r.sttl_challenges; if(!c) return;
    if(period!=='overall' && monthKeyOf(resultPlayedAt(r))!==period) return;
    const A=[c.challenger_id,c.challenger_partner_id].filter(Boolean);
    const B=[c.opponent_id,c.opponent_partner_id].filter(Boolean);
    const win = r.winner_side==='challenger'?A:B, lose = r.winner_side==='challenger'?B:A;
    win.forEach(id=>{ const t=stat[id]||(stat[id]={played:0,wins:0,losses:0}); t.played++; t.wins++; });
    lose.forEach(id=>{ const t=stat[id]||(stat[id]={played:0,wins:0,losses:0}); t.played++; t.losses++; });
  });
  return leagueCache.players.filter(p=>p.is_approved).map(p=>({id:p.id,name:p.name,rating:p.rating,photo_url:p.photo_url,played:0,wins:0,losses:0,...(stat[p.id]||{})}));
}
// Most matches played comes first (this beats winning). Ties are broken in a
// fixed order so there is always exactly one leader:
//   1) most matches played  2) most wins  3) higher rating points  4) name A–Z
function rankMostPlayed(rows){
  return [...rows].sort((a,b)=> b.played-a.played || b.wins-a.wins || b.rating-a.rating || String(a.name).localeCompare(String(b.name)));
}
function tieNote(sorted){
  if(sorted.length<2 || sorted[0].played===0) return '';
  const a=sorted[0], b=sorted[1];
  if(a.played!==b.played) return '';
  if(a.wins!==b.wins) return `tied on ${a.played} played — decided by most wins`;
  if(a.rating!==b.rating) return `tied on ${a.played} played and ${a.wins} wins — decided by higher points`;
  return `tied on everything — decided alphabetically`;
}

function winPct(wins, losses){
  const total = (wins||0) + (losses||0);
  return total ? Math.round((wins/total)*100) + '%' : '—';
}
function ratingLevel(r){
  if(r>=2700) return 'Pro';
  if(r>=2200) return 'Elite';
  if(r>=1700) return 'Advanced';
  if(r>=1200) return 'Intermediate';
  return 'Beginner';
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file.'));
    reader.onload = ()=>{
      img.onerror = ()=>reject(new Error('Could not read the image.'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * (maxDim/w)); w = maxDim; }
          else { w = Math.round(w * (maxDim/h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('Could not compress the image.')); return; }
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function renderMatchHistory(matchType){

  // `players` cache, which is otherwise only populated by the Play tab.
  // Dashboard is the default landing tab after login, so without this the

  const doublesBoard = [...all].sort((a,b)=>b.doublesWins-a.doublesWins || (b.doublesWins-b.doublesLosses)-(a.doublesWins-a.doublesLosses));

  // League-wide match counts (one row in sttl_match_results = one match).
  // Counted by the date each match was PLAYED.
  const curKey = monthKeyOffset(0), lastKey = monthKeyOffset(-1);
  const leagueTotal = leagueCache ? leagueCache.results.length : 0;
  const leagueMonth = leagueCache ? leagueCache.results.filter(r=>monthKeyOf(resultPlayedAt(r))===curKey).length : 0;
  const mpOverall = rankMostPlayed(mostPlayedRows('overall'));
  const mpThis = rankMostPlayed(mostPlayedRows(curKey));
  const mpLast = rankMostPlayed(mostPlayedRows(lastKey));

// Admin sections start collapsed (there are many of them). Which ones the
// admin has opened is remembered for the session, so an action like
// "Approve" — which re-renders the tab — doesn't snap everything shut.
const adminOpenSections = new Set();
function makeCollapsible(container){
  [...container.children].filter(el=>el.classList.contains('card')).forEach(card=>{
    const h2 = [...card.children].find(el=>el.tagName==='H2');
    if(!h2) return;
    const label = h2.textContent;
    const body = document.createElement('div');
    body.className = 'collapsible-body';
    [...card.childNodes].forEach(n=>{ if(n!==h2) body.appendChild(n); });
    card.appendChild(body);
    card.classList.add('admin-card');
    h2.classList.add('collapsible-header');
    const setState = (open)=>{
      body.classList.toggle('hidden', !open);
      h2.textContent = (open ? '▾ ' : '▸ ') + label;
    };
    setState(adminOpenSections.has(label));
    h2.onclick = ()=>{
      const open = body.classList.contains('hidden');
      if(open) adminOpenSections.add(label); else adminOpenSections.delete(label);
      setState(open);
    };
  });
}

// Best-effort sweep: approves any result that's sat unacknowledged for 48h+.
// Errors are deliberately swallowed — this must never block a page from
// loading (e.g. if the database function hasn't been deployed yet).
async function quietAutoApprove(){
  try{ await sb.rpc('auto_approve_stale_results'); }catch(e){ /* ignore */ }
}

async function renderPlay(){
  if(!canPlay(me)){
    app.innerHTML = `<div class="card"><h2>Play</h2>
      <p class="muted">${!me.is_approved ? 'Your account is pending admin approval. Once approved you can start challenging players.' : 'Your free month and subscription have both ended. Please subscribe ($2/month) to keep playing.'}</p></div>`;
    return;
  }
  showLoading('Loading your matches…');
  await quietAutoApprove();
  if(communities.length===0){
    const {data} = await sb.from('sttl_communities').select('name').order('name');
    communities = data || [];
  }
  await refreshPlayers();
  const {data:incoming} = await sb.from('sttl_challenges').select('*').eq('opponent_id',me.id).eq('status','pending');
  const {data:outgoing} = await sb.from('sttl_challenges').select('*').eq('challenger_id',me.id).eq('status','pending');
  const {data:accepted} = await sb.from('sttl_challenges').select('*').or(`challenger_id.eq.${me.id},opponent_id.eq.${me.id}`).eq('status','accepted');
  const ids = (accepted||[]).map(c=>c.id);
  let results=[];
  if(ids.length){ const {data} = await sb.from('sttl_match_results').select('*').in('challenge_id',ids); results=data||[]; }

  const matchRows = await Promise.all((accepted||[]).map(async c=>{
    const res = results.find(r=>r.challenge_id===c.id);
    const when = c.scheduled_at ? fmtPlayed(c.scheduled_at) : '<span class="muted">—</span>';
    const venue = c.venue ? esc(c.venue) : '<span class="muted">—</span>';
    let action='';
    if(!res){
      action = `<button class="btn" onclick="openScoreEntry('${c.id}')">Enter winner</button>`;
    } else if(!res.acknowledged && res.entered_by!==me.id){
      action = `<button class="btn" onclick="ackScore(this,'${res.id}')">Accept result</button> <button class="btn ghost" style="color:var(--warn)" onclick="rejectResult(this,'${res.id}')">Reject</button> <span class="muted">(winner: ${res.winner_side==='challenger'?await nameOf(c.challenger_id):await nameOf(c.opponent_id)})</span>`;
    } else if(!res.acknowledged){
      action = `<span class="badge muted">Waiting for opponent to accept</span>`;
    } else {
      action = `<span class="badge ok">Points recorded — winner: ${res.winner_side==='challenger'?await nameOf(c.challenger_id):await nameOf(c.opponent_id)}</span>`;
    }
    let pointsCell = '<span class="muted">—</span>';
    if(res && res.acknowledged && res.rating_delta){
      const iAmChallengerSide = c.challenger_id===me.id || c.challenger_partner_id===me.id;
      const iWon = (res.winner_side==='challenger') === iAmChallengerSide;
      pointsCell = iWon ? `<span class="badge ok">+${res.rating_delta}</span>` : `<span class="badge warn">−${res.rating_delta}</span>`;
    }
    return `<tr><td>${await nameOf(c.challenger_id)}</td><td>${await nameOf(c.opponent_id)}</td><td>${c.match_type}</td><td>${when}</td><td>${venue}</td><td>${pointsCell}</td><td>${action}</td></tr>`;
  }));

  app.innerHTML = `
  <div class="card"><h2>Record a match you've already played</h2>
    <p class="muted">For games played outside a formal challenge — pick who played and who won. Your opponent must approve it before the score list updates.</p>
    <label>Match type</label>
    <select id="qr_type"><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
    <label>Opponent</label>
    <select id="qr_opp">${players.map(p=>`<option value="${p.id}">${p.name} (${p.community_center})</option>`).join('')}</select>
    <div id="qr_partnerBox" class="hidden">
      <label>Your partner</label><select id="qr_myPartner">${players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
      <label>Opponent's partner</label><select id="qr_oppPartner">${players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
    </div>
    <label>Winner</label>
    <select id="qr_winner"><option value="me">Me</option><option value="opp">Opponent</option></select>
    <label>Date &amp; time played (defaults to now; no future dates)</label>
    <input type="datetime-local" id="qr_when">
    ${venuePickerHtml('qr_venue')}
    <button class="btn" id="qr_submit" style="margin-top:12px">Submit for opponent's approval</button>
    <div class="error" id="qr_err"></div>
  </div>
  <div class="card"><h2>Your matches</h2>
    <p class="muted">Pick the winner — your opponent must accept it for the points to reflect.</p>
    <div class="table-scroll"><table><tr><th>Challenger</th><th>Opponent</th><th>Type</th><th>Played / due</th><th>Venue</th><th>Points</th><th>Status</th></tr>${matchRows.join('')||'<tr><td colspan=7 class="muted">No accepted matches yet.</td></tr>'}</table></div>
  </div>
  <div class="card"><h2>Challenge someone</h2>
    <label>Match type</label>
    <select id="mtype"><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
    <label>Opponent</label>
    <select id="opp">${players.map(p=>`<option value="${p.id}">${p.name} (${p.community_center}) · rating ${p.rating}</option>`).join('')}</select>
    <div id="partnerBox" class="hidden">
      <label>Your partner</label><select id="myPartner">${players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
      <label>Opponent's partner</label><select id="oppPartner">${players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
    </div>
    <label>Date &amp; time (defaults to now — change it if earlier; no future dates)</label>
    <input type="datetime-local" id="whenPlay">
    ${venuePickerHtml('venue')}
    <button class="btn" id="sendChallenge" style="margin-top:12px">Send Challenge</button>
    <div class="error" id="ch_err"></div>
  </div>
  <div class="card"><h2>Incoming challenges</h2>
    ${(incoming&&incoming.length)? (await Promise.all(incoming.map(async c=>`
      <div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:8px 0">
        <div>${await nameOf(c.challenger_id)} challenged you (${c.match_type})${c.scheduled_at?` — <span class="muted">${fmtDateTime(c.scheduled_at)}</span>`:''}${c.venue?` <span class="muted">at ${esc(c.venue)}</span>`:''}</div>
        <div><button class="btn" onclick="respondChallenge(this,'${c.id}','accepted')">Accept</button>
        <button class="btn ghost" onclick="respondChallenge(this,'${c.id}','declined')">Decline</button></div>
      </div>`))).join('') : '<p class="muted">None right now.</p>'}
  </div>
  <div class="card"><h2>Outgoing challenges (pending)</h2>
    ${(outgoing&&outgoing.length)? (await Promise.all(outgoing.map(async c=>`<div class="muted" style="padding:6px 0">Waiting on ${await nameOf(c.opponent_id)} (${c.match_type})${c.scheduled_at?` — ${fmtDateTime(c.scheduled_at)}`:''}${c.venue?` at ${esc(c.venue)}`:''}</div>`))).join(''):'<p class="muted">None right now.</p>'}
  </div>
  `;
  document.getElementById('mtype').onchange = e=>{
    document.getElementById('partnerBox').classList.toggle('hidden', e.target.value!=='doubles');
  };
  wireVenuePicker('venue');
  initNowInputs(['whenPlay','qr_when']);
  document.getElementById('sendChallenge').onclick = async (e)=>{
    const btn=e.currentTarget;
    const opponent_id0 = document.getElementById('opp').value;
    const errEl=document.getElementById('ch_err');
    errEl.textContent='';
    const _whenChk=validatePlayWhenVenue(document.getElementById('whenPlay').value, getVenueValue('venue'), 'challenge');
    if(_whenChk){ errEl.textContent=_whenChk; return; }
    setLoading(btn,true,'Sending...');
    const _mt0=document.getElementById('mtype').value;
    const _lim0=await monthlyLimitMessage(opponent_id0,_mt0,document.getElementById('whenPlay').value);
    if(_lim0){
      setLoading(btn,false);
      errEl.textContent=_lim0;
      return;
    }
    const match_type = document.getElementById('mtype').value;
    const opponent_id = document.getElementById('opp').value;
    const whenVal = document.getElementById('whenPlay').value;
    const venue = getVenueValue('venue');
    const payload = {challenger_id:me.id, opponent_id, match_type, status:'pending'};
    payload.scheduled_at = new Date(whenVal).toISOString();
    payload.venue = venue;
    if(match_type==='doubles'){
      payload.challenger_partner_id = document.getElementById('myPartner').value;
      payload.opponent_partner_id = document.getElementById('oppPartner').value;
    }
    const {error} = await sb.from('sttl_challenges').insert(payload);
    if(error){ setLoading(btn,false); document.getElementById('ch_err').textContent = error.message; }
    else { document.getElementById('ch_err').style.color='var(--ok)'; document.getElementById('ch_err').textContent='Challenge sent!'; renderPlay(); }
  };
  function updateQrWinnerLabels(){
    const isDoubles = document.getElementById('qr_type').value==='doubles';
    const oppSel = document.getElementById('qr_opp');
    const oppName = (oppSel.options[oppSel.selectedIndex]?.text || 'Opponent').split(' (')[0];

    if(rErr){ setLoading(btn,false); err.textContent = rErr.message; return; }
    renderPlay();

async function nameOf(id){ const p = players.find(x=>x.id===id) || (id===me.id?me:null); return p? esc(p.name) : id?.slice(0,6); }

async function monthlyLimitMessage(opponentId, matchType, whenVal){
  // Friendly client-side pre-check; the database trigger is the real enforcement.
  // Limits are counted by the month the match is PLAYED in.
  const base = whenVal ? new Date(whenVal) : new Date();
  const monthStart=new Date(base.getFullYear(), base.getMonth(), 1).toISOString();
  const nextStart=new Date(base.getFullYear(), base.getMonth()+1, 1).toISOString();
  const {data:mine}=await sb.from('sttl_challenges').select('id,match_type,status,scheduled_at,challenger_id,opponent_id,challenger_partner_id,opponent_partner_id')
    .neq('status','declined')
    .gte('scheduled_at', monthStart).lt('scheduled_at', nextStart)
    .or(`challenger_id.eq.${me.id},opponent_id.eq.${me.id},challenger_partner_id.eq.${me.id},opponent_partner_id.eq.${me.id}`);
  const rows=mine||[];
  if(rows.length>=10) return 'You have reached the limit of 10 matches in that calendar month.';
  if(matchType!=='doubles'){
    const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate();};
    const dup=rows.some(r=>r.match_type!=='doubles' && dayKey(r.scheduled_at)===dayKey(base) && ((r.challenger_id===me.id&&r.opponent_id===opponentId)||(r.challenger_id===opponentId&&r.opponent_id===me.id)));
    if(dup) return 'You have already played this player in singles on that day. The same matchup is limited to once a day (and each player can play 10 matches a month).';
  }
  return null; // doubles matchup rule is checked by the server
}

window.submitScore = async (btn,challengeId)=>{
  const winner=document.getElementById('win_pick').value;
  setLoading(btn,true,'Submitting...');
  const {data:c} = await sb.from('sttl_challenges').select('*').eq('id',challengeId).single();
  const winner_side = winner==='me' ? (c.challenger_id===me.id?'challenger':'opponent') : (c.challenger_id===me.id?'opponent':'challenger');
  const {error} = await sb.from('sttl_match_results').insert({challenge_id:challengeId, sets:null, winner_side, entered_by:me.id});
  if(error){ setLoading(btn,false); document.getElementById('sc_err').textContent = error.message; return; }
  closeModal(); renderPlay();
};
function expectedScore(ratingA, ratingB){
  return 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
}
window.ackScore = async (btn,resultId)=>{
  setLoading(btn,true,'Recording...');
  // The actual rating math (upset-sensitive, same formula as expectedScore
  // above) now runs server-side in record_match_acknowledgement(), which
  // also verifies you're genuinely part of this match before touching
  // anyone's rating — direct table updates for this are no longer allowed.
  const {error} = await sb.rpc('record_match_acknowledgement', {p_result_id: resultId});
  setLoading(btn,false);
  if(error){ alert('Could not record this result: '+error.message); return; }
  renderPlay();
};
window.rejectResult = async (btn,resultId)=>{
  if(!confirm("Reject this result? It will be removed so either player can submit the correct winner.")) return;
  setLoading(btn,true,'Rejecting...');
  const {error} = await sb.rpc('reject_match_result', {p_result_id: resultId});
  setLoading(btn,false);
  if(error){ alert('Could not reject this result: '+error.message); return; }
  renderPlay();
};

function ratingTier(r){
  if(r>=1300) return {name:'Gold', pct:15};
  if(r>=1150) return {name:'Silver', pct:10};
  return {name:'Bronze', pct:5};
}

    <div class="table-scroll" style="max-height:420px;overflow:auto"><table><tr><th>Played</th><th>Venue</th><th>Type</th><th>Side A</th><th>Side B</th><th>Result</th><th>Points</th><th>Flags</th><th>Created (admin)</th></tr>${matchDetailRows}</table></div>
  </div>
  <div class="card"><h2>Admin settings</h2>
    <label><input type="checkbox" id="pinToggle" ${me.admin_pin_enabled?'checked':''}> Require PIN to open Admin tab</label>
    <label><input type="checkbox" id="sponsorToggle" ${sponsorVisible?'checked':''}> Show sponsor details across the app</label>
    <label>Waive subscriptions for a month (pick a month, or clear for none)</label>
    <div class="row" style="align-items:center">
      <input type="month" id="disMonth" value="${cfg?.subscriptions_disabled_month||''}" placeholder="YYYY-MM">
      <button class="btn ghost" type="button" id="disMonthClear" style="flex:0 0 auto;min-width:80px">Clear</button>
    </div>
    <button class="btn" id="saveCfg" style="margin-top:10px">Save settings</button>
  </div>

  <div class="card"><h2>Add a new player</h2>
    <div class="row">
      <div><label>Name</label><input id="nu_name"></div>
      <div><label>Email</label><input id="nu_email" type="email"></div>
    </div>
    <div class="row">
      <div><label>Temp password</label><input id="nu_pw" type="password"></div>
      <div><label>Age</label><input id="nu_age" type="number"></div>
    </div>
    <label>Community Center</label>
    <select id="nu_cc">${(ccs||[]).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select>
    <div class="error" id="nu_err"></div>
    <button class="btn" id="nu_go" style="margin-top:10px">Add player (auto-approved)</button>
  </div>
  <div class="card"><h2>Manage players</h2>
    <label>Search (name, community, email or age)</label>
    <input id="playerSearch" placeholder="Start typing to filter...">
    <div id="playersList" style="margin-top:10px"></div>
  </div>
  <div class="card"><h2>Manually enter a match result</h2>
    <p class="muted">For recording a match directly — historical results, or games played outside the app. This applies rating points immediately; no opponent acceptance needed. The same limits (same matchup once a day, 10 matches a month) still apply.</p>
    <label>Match type</label>
    <select id="am_type"><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
    <div class="row">
      <div><label>Side A player</label><select id="am_a">${(all||[]).filter(p=>p.is_approved).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div id="am_a_partner_box" class="hidden"><label>Side A partner</label><select id="am_a_partner">${(all||[]).filter(p=>p.is_approved).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>Side B player</label><select id="am_b">${(all||[]).filter(p=>p.is_approved).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div id="am_b_partner_box" class="hidden"><label>Side B partner</label><select id="am_b_partner">${(all||[]).filter(p=>p.is_approved).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    </div>
    <label>Winner</label>
    <select id="am_winner"><option value="challenger">Side A</option><option value="opponent">Side B</option></select>
    <label>Date &amp; time played (defaults to now; no future dates)</label>
    <input type="datetime-local" id="am_when">
    ${venuePickerHtml('am_venue')}
    <button class="btn" id="am_submit" style="margin-top:12px">Record match</button>
    <div class="error" id="am_err"></div>
  </div>
  <div class="card"><h2>Manage matches</h2>
    <p class="muted">Deleting a match removes its challenge and any result record. It does <b>not</b> automatically reverse rating points that were already applied when the result was accepted.</p>
    <div class="table-scroll"><table><tr><th>Played</th><th>Side A</th><th>Side B</th><th>Type</th><th>Status</th><th>Result</th><th>Created (admin)</th><th>Actions</th></tr>${matchRowsAdmin}</table></div>
  </div>
  <div class="card"><h2>Singles match history</h2>
    <div class="table-scroll"><table><tr><th>Played</th><th>Player 1</th><th>Player 2</th><th>Winner</th><th>Points</th></tr>${singlesHistory}</table></div>
  </div>
  <div class="card"><h2>Doubles match history</h2>
    <div class="table-scroll"><table><tr><th>Played</th><th>Team 1</th><th>Team 2</th><th>Winner</th><th>Points</th></tr>${doublesHistory}</table></div>
  </div>
  <div class="card"><h2>Community centers</h2>
    <div class="row">${(ccs||[]).map(c=>`<span class="tag">${c.name} <a onclick="removeCC('${c.id}','${c.name.replace(/'/g,"\\'")}')" style="cursor:pointer">✕</a></span>`).join(' ')}</div>
    <div class="row" style="margin-top:10px"><input id="newCC" placeholder="New community center name"><button class="btn" id="addCCBtn">Add</button></div>
    <div class="error" id="cc_err"></div>
  </div>
  <div class="card"><h2>Inactivity notes</h2>
    ${(notes.data||[]).map(n=>`<p><b>${esc(n.sttl_players?.name||'')}</b>: ${esc(n.reason)} <span class="muted">(${fmtDate(n.created_at)})</span></p>`).join('')||'<p class="muted">None.</p>'}
  </div>`;
  document.getElementById('disMonthClear').onclick = ()=>{ document.getElementById('disMonth').value=''; };
  document.getElementById('saveCfg').onclick = async (e)=>{
    setLoading(e.currentTarget,true,'Saving...');
    const pinToggle=document.getElementById('pinToggle').checked;
    const sponsorToggle=document.getElementById('sponsorToggle').checked;
    const disMonth=document.getElementById('disMonth').value.trim()||null;
    await sb.from('sttl_players').update({admin_pin_enabled:pinToggle}).eq('id',me.id);
    await sb.from('sttl_app_config').update({subscriptions_disabled_month:disMonth, sponsor_visible:sponsorToggle}).eq('id',1);
    me.admin_pin_enabled=pinToggle;
    sponsorVisible=sponsorToggle;
    applySponsorVisibility();
    renderAdmin();
  };
  function playerRowHtml(p){
    return `<div class="player-item">
      <div class="player-item-head">
        <div>${avatarHtml(p,24)}<b>${esc(p.name)}</b>${p.is_admin?' <span class="tag">admin</span>':''}</div>
        <div class="muted" style="font-size:12px">✉️ ${esc(p.email)||'—'}</div>
      </div>
      <div class="player-item-meta">
        <span>📍 ${p.community_center}</span>
        <span>🎂 ${p.age}</span>
        <span>🕒 ${fmtDateTime(p.last_login_at)}</span>
      </div>
      <div class="player-item-meta">
        ${p.is_approved?'<span class="badge ok">✅ Approved</span>':'<span class="badge warn">⏳ Pending</span>'}
        <label style="display:inline-flex;align-items:center;gap:4px;margin:0;font-size:13px;cursor:pointer">
          <input type="checkbox" ${p.is_subscribed?'checked':''} onchange="toggleSubscription(this,'${p.id}')"> 💳 Subscribed
        </label>
      </div>
      <div class="row" style="margin-top:8px">
        ${!p.is_approved?`<button class="btn" onclick="approveUser(this,'${p.id}')">✅ Approve</button>`:''}
        <button class="btn ghost" onclick="editUser('${p.id}')">✏️ Edit</button>
        <button class="btn ghost" style="color:var(--warn)" onclick="deleteUser(this,'${p.id}')">🗑️ Remove</button>
      </div>
    </div>`;
  }
  function renderPlayerRows(list){
    document.getElementById('playersList').innerHTML = list.length
      ? list.map(playerRowHtml).join('')
      : '<p class="muted">No players match your search.</p>';
  }
  renderPlayerRows(all||[]);
  document.getElementById('playerSearch').oninput = (e)=>{
    const q=e.target.value.trim().toLowerCase();
    if(!q){ renderPlayerRows(all||[]); return; }
    renderPlayerRows((all||[]).filter(p=>
      (p.name||'').toLowerCase().includes(q) ||
      (p.community_center||'').toLowerCase().includes(q) ||
      (p.email||'').toLowerCase().includes(q) ||
      String(p.age||'').includes(q)
    ));
  };
  document.getElementById('nu_go').onclick = async (e)=>{
    const btn=e.currentTarget;
    const name=document.getElementById('nu_name').value.trim();
    const email=document.getElementById('nu_email').value.trim();
    const password=document.getElementById('nu_pw').value;
    const age=parseInt(document.getElementById('nu_age').value,10);
    const community_center=document.getElementById('nu_cc').value;
    const err=document.getElementById('nu_err');
    if(!name||!email||!pwOk(password)||!age){ err.textContent='Fill all fields; password needs upper/lower/number/special, 8+ chars.'; return; }
    const nameErr = await validateName(name, email);
    if(nameErr){ err.textContent = nameErr; return; }
    setLoading(btn,true,'Adding...');
    // Uses sbAdmin (a separate client instance) so this signUp never
    // disturbs the admin's own logged-in session.
    let newId=null, flash='';
    const {data:createData, error:createErr} = await getSbAdmin().auth.signUp({email,password});
    const alreadyReg = !!createErr && /already/i.test(createErr.message||'');
    if(createErr && !alreadyReg){ setLoading(btn,false); err.textContent = createErr.message; return; }
    if(!createErr && createData.user && !(createData.user.identities && createData.user.identities.length===0)){
      newId = createData.user.id;
      if(!createData.session) flash='Player added. They may need to confirm their email before logging in (or turn OFF "Confirm email" in Supabase Auth settings).';
    } else {
      // Email already has a login (e.g. an earlier attempt created the login but not the profile).
      // Try to recover: sign in with the password just typed to learn the account id.
      const {data:si, error:siErr} = await getSbAdmin().auth.signInWithPassword({email,password});
      if(siErr || !si?.user){ setLoading(btn,false); err.textContent='That email already has a login, and the password you typed does not match it — so the profile cannot be attached. Use the same password they registered with, or ask them to log in and finish their profile.'; return; }
      newId = si.user.id;
      try{ await getSbAdmin().auth.signOut(); }catch(_){}
    }
    const {data:ex} = await sb.from('sttl_players').select('id').eq('id',newId).maybeSingle();
    if(ex){ setLoading(btn,false); err.textContent='That player already exists in the list below.'; return; }
    const {error:insErr} = await sb.from('sttl_players').insert({id:newId,name,email,age,community_center,is_approved:true});
    if(insErr){ setLoading(btn,false); err.textContent = insErr.message; return; }
    // Confirm the row really is readable before claiming success.
    const {data:chk} = await sb.from('sttl_players').select('id').eq('id',newId).maybeSingle();
    if(!chk){ setLoading(btn,false); err.textContent='The player was saved but cannot be read back — please re-run the latest sttl_schema.sql in Supabase.'; return; }
    await renderAdmin();
    const e2=document.getElementById('nu_err');
    if(e2){ e2.style.color='var(--ok)'; e2.textContent = (flash||'Player added.')+' They are at the top of the list below.'; }
    const pl=document.getElementById('playersList'); if(pl && pl.firstElementChild) pl.firstElementChild.style.outline='2px solid var(--ok)';
  };
  document.getElementById('addCCBtn').onclick = async (e)=>{
    const btn=e.currentTarget;
    const name=document.getElementById('newCC').value.trim();
    const err=document.getElementById('cc_err');
    if(!name){ return; }
    setLoading(btn,true,'Adding...');
    const {error} = await sb.from('sttl_communities').insert({name});
    if(error){ setLoading(btn,false); err.textContent = error.message; } else renderAdmin();
  };
  function updateAmWinnerLabels(){
    const isDoubles = document.getElementById('am_type').value==='doubles';
    const aSel = document.getElementById('am_a'), bSel = document.getElementById('am_b');
    let aLabel = aSel.options[aSel.selectedIndex]?.text || 'Side A';
    let bLabel = bSel.options[bSel.selectedIndex]?.text || 'Side B';
    if(isDoubles){
      const aP = document.getElementById('am_a_partner'), bP = document.getElementById('am_b_partner');
      if(aP?.options[aP.selectedIndex]) aLabel += ' &amp; ' + aP.options[aP.selectedIndex].text;
      if(bP?.options[bP.selectedIndex]) bLabel += ' &amp; ' + bP.options[bP.selectedIndex].text;
    }
    const winnerSel = document.getElementById('am_winner');
    winnerSel.options[0].text = aLabel;
    winnerSel.options[1].text = bLabel;
  }
  document.getElementById('am_type').onchange = e=>{
    const isDoubles = e.target.value==='doubles';
    document.getElementById('am_a_partner_box').classList.toggle('hidden', !isDoubles);
    document.getElementById('am_b_partner_box').classList.toggle('hidden', !isDoubles);
    updateAmWinnerLabels();
  };
  document.getElementById('am_a').onchange = updateAmWinnerLabels;
  document.getElementById('am_b').onchange = updateAmWinnerLabels;
  document.getElementById('am_a_partner').onchange = updateAmWinnerLabels;
  document.getElementById('am_b_partner').onchange = updateAmWinnerLabels;
  updateAmWinnerLabels();
  const applyMdFilter = ()=>{
    const q=(document.getElementById('mdFilter').value||'').trim().toLowerCase();
    const fo=document.getElementById('mdFlagged').checked;
    document.querySelectorAll('tr.md-row').forEach(tr=>{
      const okText = !q || (tr.dataset.text||'').includes(q);
      const okFlag = !fo || tr.dataset.flagged==='1';
      tr.classList.toggle('hidden', !(okText && okFlag));
    });
  };
  document.getElementById('mdFilter').oninput = applyMdFilter;
  document.getElementById('mdFlagged').onchange = applyMdFilter;
  wireVenuePicker('am_venue');
  initNowInputs(['am_when']);
  document.getElementById('am_submit').onclick = async (e)=>{
    const btn=e.currentTarget;
    const err=document.getElementById('am_err');
    const match_type=document.getElementById('am_type').value;
    const isDoubles = match_type==='doubles';
    const pA=document.getElementById('am_a').value;
    const pB=document.getElementById('am_b').value;
    const pAPartner = isDoubles ? document.getElementById('am_a_partner').value : null;
    const pBPartner = isDoubles ? document.getElementById('am_b_partner').value : null;
    const winner=document.getElementById('am_winner').value;
    const whenVal=document.getElementById('am_when').value;
    const venue=getVenueValue('am_venue')||null;
    err.textContent='';
    const _whenChk=validatePlayWhenVenue(whenVal, venue, 'played');
    if(_whenChk){ err.textContent=_whenChk; return; }
    if(pA===pB){ err.textContent='Side A and Side B must be different players.'; return; }
    if(isDoubles && (pAPartner===pA || pBPartner===pB || pAPartner===pB || pBPartner===pA || pAPartner===pBPartner)){
      err.textContent='Each of the four players in a doubles match must be different.'; return;
    }
    setLoading(btn,true,'Recording...');
    const {error} = await sb.rpc('admin_record_match', {
      p_challenger: pA, p_challenger_partner: pAPartner, p_opponent: pB, p_opponent_partner: pBPartner,
      p_match_type: match_type, p_winner_side: winner, p_venue: venue,
      p_scheduled_at: new Date(whenVal).toISOString()
    });
    setLoading(btn,false);
    if(error){
      alert('Could not record match: '+error.message);
      return;
    }
    renderAdmin();
  };
  // Last step, after every handler above is wired: fold each admin card
  // into a collapsible section. Nodes are moved, not recreated, so all the
  // IDs and handlers set up above keep working.
  makeCollapsible(app);
}
window.openAdminSection = (label)=>{ adminOpenSections.add(label); renderAdmin(); };
window.approveUser = async (btn,id)=>{ setLoading(btn,true,'Approving...'); await sb.from('sttl_players').update({is_approved:true}).eq('id',id); renderAdmin(); };
window.toggleSubscription = async (checkbox,id)=>{
  const newVal = checkbox.checked;
  checkbox.disabled = true;
  const {error} = await sb.from('sttl_players').update({is_subscribed:newVal}).eq('id',id);
  checkbox.disabled = false;
  if(error){ alert('Could not update subscription: '+error.message); checkbox.checked = !newVal; }
};
window.adminApproveResult = async (btn,resultId)=>{
  if(!confirm("Force-approve this result on the opponent's behalf? This updates both players' ratings.")) return;
  setLoading(btn,true,'Approving...');
  const {error} = await sb.rpc('admin_force_acknowledge_result', {p_result_id: resultId});
  setLoading(btn,false);
  if(error){ alert('Could not approve: '+error.message); return; }
  renderAdmin();
};
window.deleteMatch = async (btn,challengeId)=>{
  if(!confirm('Delete this match? This removes the challenge and any recorded result.\nIt will NOT reverse rating points already applied.')) return;
  setLoading(btn,true,'Deleting...');
  const {error} = await sb.from('sttl_challenges').delete().eq('id',challengeId);
  setLoading(btn,false);
  if(error){ alert('Could not delete match: '+error.message); return; }
  renderAdmin();
};
window.deleteUser = async (btn,id)=>{
  if(!confirm('Remove this player from the league?\n\nThis deletes their profile, ratings and match links. Their login will still exist in Supabase Auth — remove it there too if you want them fully gone.')) return;
  setLoading(btn,true,'Removing...');
  const {error} = await sb.from('sttl_players').delete().eq('id',id);
  if(error){ setLoading(btn,false); alert('Could not remove player: '+error.message); return; }
  renderAdmin();
};
window.removeCC = async (id,name)=>{
  if(!confirm(`Remove ${name}?`)) return;
  const {error} = await sb.from('sttl_communities').delete().eq('id',id);
  if(error) alert(error.message); else renderAdmin();
};
window.editUser = async (id)=>{
  const {data:p} = await sb.from('sttl_players').select('*').eq('id',id).single();
  modal(`<h2>Edit ${esc(p.name)}</h2>
    <label>Name</label><input id="e_name" value="${esc(p.name)}">
    <label>Age</label><input id="e_age" type="number" value="${p.age}">
    <label>Community Center</label><input id="e_cc" value="${p.community_center}">
    <label><input type="checkbox" id="e_sub" ${p.is_subscribed?'checked':''}> Subscribed</label>
    <label><input type="checkbox" id="e_admin" ${p.is_admin?'checked':''}> Admin</label>
    <div class="error" id="e_err"></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="saveEdit('${id}','${(p.email||'').replace(/'/g,"\\'")}')">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
};
window.saveEdit = async (id,email)=>{
  const err=document.getElementById('e_err');
  const name=document.getElementById('e_name').value;
  const nameErr = await validateName(name, email, id);
  if(nameErr){ err.textContent = nameErr; return; }
  await sb.from('sttl_players').update({
    name,
    age:parseInt(document.getElementById('e_age').value,10),
    community_center:document.getElementById('e_cc').value,
    is_subscribed:document.getElementById('e_sub').checked,
    is_admin:document.getElementById('e_admin').checked
  }).eq('id',id);
  closeModal(); renderAdmin();
};

// ---------- INIT ----------
(async ()=>{
  const {data:cfg} = await sb.from('sttl_app_config').select('sponsor_visible').eq('id',1).maybeSingle();
  sponsorVisible = cfg?.sponsor_visible !== false;
  applySponsorVisibility();
  const {data:{session:s}} = await sb.auth.getSession();
  if(s){ session=s; await loadMeAndBoot(); } else { renderLogin(); }
})();
</script>
</body>
</html>
